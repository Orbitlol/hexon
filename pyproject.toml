[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hexon"
version = "1.0.0"
description = "Hexon: Compact Mobile-First AI Language Model (PyTorch + GGUF v3 + TorchScript)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "chromadb>=1.0.0",
]

[project.scripts]
hexon = "hexon.cli:main"

[tool.setuptools.packages.find]
include = ["hexon*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
